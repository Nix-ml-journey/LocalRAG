# Each brief: who tells the story, where, the one strange or central event, and what is at stake.
# Keep the wording stable between runs: README results compare scripts written from these exact briefs.
- id: b01
  genre: horror
  minutes: 10
  brief: A night security guard at an empty parking garage keeps receiving tickets from a machine that prints them by itself. Each ticket carries a time a little later than the last, and he fears what happens when the clock on the ticket reaches the present.
  expect_sources: [horror_night_shift]
- id: b02
  genre: horror
  minutes: 5
  brief: A lighthouse keeper realizes someone else has been writing in the logbook and walking the stairs behind him. The handwriting is neat, the entries are accurate, and the last one describes tonight before it has happened.
  expect_sources: [horror_lighthouse_log]
- id: b03
  genre: history
  minutes: 15
  brief: A researcher investigates why the Mary Celeste was found drifting with nobody aboard in 1872. She weighs the main explanations against the ship's log, the cargo and the missing lifeboat, and says which ones the evidence cannot support.
  expect_sources: [lore_mary_celeste, history_mary_celeste_archive]
- id: b04
  genre: history
  minutes: 10
  brief: A visitor to Roanoke Island reflects on the vanished colony and the word carved on a post. Standing where the settlement stood, he asks what the carving meant and what the colonists left behind.
  expect_sources: [lore_roanoke, history_roanoke_visit]
- id: b05
  genre: history
  minutes: 20
  brief: Compare the Mary Celeste and the Roanoke colony as two famous unsolved disappearances, from the view of an archivist. She sets the two side by side, what was found, what was missing and what each one still cannot explain.
  expect_sources: [lore_mary_celeste, lore_roanoke]
- id: b06
  genre: fantasy
  minutes: 10
  brief: A marsh warden guides a nervous clerk across tidal flats and finds a light that should not be there. The tide is turning, the clerk wants to follow the light, and the warden knows what happened to the last person who did.
  expect_sources: [lore_saltmarch, fantasy_salt_warden]
- id: b07
  genre: fantasy
  minutes: 15
  brief: An aging mapmaker is hired to draw a road that rewrites itself, and learns what each true line costs him. Every line he gets right takes something from his own memory, and he must decide how much of his life the road is worth.
  expect_sources: [fantasy_ember_cartographer]
- id: b08
  genre: cthulhu
  minutes: 10
  brief: A 1920s ocean surveyor plots odd soundings that form the outline of a drowned city. His crew wants to turn back, the soundings keep growing more regular, and the shape on his chart begins to look like streets.
  expect_sources: [cthulhu_survey_log, lore_call_of_cthulhu]
- id: b09
  genre: cthulhu
  minutes: 5
  brief: A library cataloguer receives a box of letters whose last page should never be read. The earlier readers of the letters all wrote notes in the margins, and the notes get more frightened with each reader.
  expect_sources: [cthulhu_archive_letters]
- id: b10
  genre: horror
  minutes: 20
  brief: A man discovers that his own handwriting appears in letters he never wrote, dated decades before he was born. He traces the letters to an old address and finds that someone there has been answering them.
  expect_sources: [hooks_openers]
- id: b11
  genre: history
  minutes: 10
  brief: A lighthouse inspector investigates why three keepers vanished from the Flannan Isles in December 1900 and left the door closed behind them. He reads the log, the last relief visit and the state of the lighthouse, and separates what was recorded from what was only rumored.
  expect_sources: [lore_flannan_isles]
- id: b12
  genre: history
  minutes: 15
  brief: A mountaineering historian retraces the last camp of nine hikers on Kholat Syakhl in the Ural Mountains in 1959. She walks through the tent, the footprints and the search report, and says which explanations the evidence supports and which it does not.
  expect_sources: [lore_dyatlov_pass]
- id: b13
  genre: history
  minutes: 15
  brief: An Arctic archivist studies the note found at Victory Point and what happened to the crews of Erebus and Terror. She reads what the note says, what it leaves out, and what the later searches found along the route.
  expect_sources: [lore_franklin_expedition]
- id: b14
  genre: history
  minutes: 10
  brief: A city clerk in Strasbourg records the summer of 1518 when people danced in the streets for days. He writes down who danced, what the council tried, and what he saw in the square.
  expect_sources: [lore_dancing_plague_1518]
- id: b15
  genre: sci-fi
  minutes: 5
  brief: A courier delivers a parcel to an address that was demolished years ago, yet the recipient signs for it. The signature matches his own, and the parcel holds something he has not yet lost.
  expect_sources: [dick_Ubik]
- id: b16
  genre: horror
  minutes: 10
  brief: A guest in a country house tower room realises the previous occupant's dream is repeating in his own sleep. Each night the dream goes a little further, and he learns how it ended for the man before him.
  expect_sources: [benson_The_Room_in_the_Tower]
- id: b17
  genre: literary
  minutes: 10
  brief: A widow keeps setting a second place at the table and the neighbours slowly start to ask why. She explains nothing at first, and the reason comes out through small daily habits rather than speeches.
  expect_sources: [literary]
# b18-b27: the second set of ten, written after the Machen and Wells ingest (horror, sci-fi) and for the history lore notes the first set never used.
- id: b18
  genre: horror
  minutes: 10
  brief: A surveyor walking the Welsh hills finds a footpath that is on no map and leads to a ring of stones. Each time he turns back, the path is a little shorter, and the village below no longer answers his lantern.
  expect_sources: [machen_]
- id: b19
  genre: horror
  minutes: 10
  brief: A London doctor agrees to a small operation on a young woman's brain that will let her see what lies behind ordinary things. Afterward she is calm and unafraid, and the people who meet her are not.
  expect_sources: [machen_]
- id: b20
  genre: horror
  minutes: 10
  brief: A man inherits the green notebook of a country girl who wrote about the games she played alone in the woods. The games are described in careful detail, and the last page is dated tomorrow.
  expect_sources: [machen_]
- id: b21
  genre: horror
  minutes: 10
  brief: A London clerk follows a stranger home through the back streets after dark and is invited in. The house is full of other men who followed the same stranger, and none of them has left.
  expect_sources: [machen_]
- id: b22
  genre: sci-fi
  minutes: 10
  brief: A man in a quiet English town sees a cylinder fall on the common at night. By morning a crowd has gathered, the lid has begun to turn, and he is the only one who thinks they should go home.
  expect_sources: [wells_The_War_of_the_Worlds]
- id: b23
  genre: sci-fi
  minutes: 10
  brief: A survivor hides in the ruins of a house while red weed creeps over the garden and the machines walk past outside. He has food for a few days, a stranger sharing the cellar, and the sound of something digging.
  expect_sources: [wells_The_War_of_the_Worlds]
- id: b24
  genre: sci-fi
  minutes: 10
  brief: A man walks into an empty London after the machines have stopped. The streets are silent, the dogs are feeding, and he cannot tell whether the silence means the end or a pause.
  expect_sources: [wells_The_War_of_the_Worlds]
- id: b25
  genre: history
  minutes: 10
  brief: A coastal police archivist reviews the man found dead on Somerton beach in Adelaide in 1948. She goes through his clothes, the scrap of paper in his pocket and the suitcase at the station, and says which explanations the record supports.
  expect_sources: [lore_somerton_man]
- id: b26
  genre: history
  minutes: 10
  brief: A shipping clerk in Durban reads the file on the steamer Waratah, which sailed for Cape Town in July 1909 and was never seen again. He lists what the search found, what the inquiry concluded and what nobody could explain.
  expect_sources: [lore_ss_waratah]
- id: b27
  genre: history
  minutes: 10
  brief: A rare-books librarian studies the Voynich manuscript at Yale. She describes the pages, the unknown script and the plants nobody can name, and separates what the evidence shows from the theories people want to be true.
  expect_sources: [lore_voynich_manuscript]
