# All paths are relative to the project root.
paths:
  data_dir: data
  chroma_dir: .chroma
  state_file: .chroma/ingest_state.json   # file hashes + cached LLM tags
  output_dir: output
  prompts_dir: prompts
  banned_phrases: banned_phrases.txt

llm:
  host: http://localhost:11434
  model: gemma4:12b         # swap: qwen3:14b, mistral-nemo, ...
  num_ctx: 16384
  min_ctx: 4096             # OOM retry halves num_ctx down to this
  temperature: 0.8
  repeat_penalty: 1.1       # curbs the looping small models fall into on long prose
  think_outline: false      # thinking was used up on the token budget with no JSON (185 s lost in a run); the outline retry already runs without it
  keep_alive: 10m
  timeout: 600              # seconds one model call may take before it fails (a hung Ollama once blocked a run for 5 hours)
  parallel: 1               # polish calls in flight at once; raise only together with OLLAMA_NUM_PARALLEL (see README)

embedding:
  model: BAAI/bge-m3
  device: cpu

retrieval:
  candidates: 30            # per retriever (dense, BM25) before fusion
  rrf_k: 60
  final_k: 4                # chunks passed to the LLM per collection

chunking:
  min_tokens: 300
  max_tokens: 500
  overlap: 0.15

script:
  wpm: 150

style:                      # narration targets: the prompts and the checks both read these, so tune them here only
  sentence_words: [12, 16]  # average spoken words per sentence
  max_pause_per_section: 1  # [PAUSE] cues allowed in one section
  max_pauses_per_minute: 2  # more [PAUSE] cues than this a minute is reported as halting

checks:
  ngram: 5
  overlap_threshold: 0.8    # flag passages whose 5-grams are >80% present in a source chunk
  repeated_ngram: 4         # repeated-phrase rate uses this n
  section_repeat: 0.08      # a section draft is rewritten when more than this share of its 4-grams repeat
  earlier_overlap: 0.6      # ... or when more than this share of a paragraph's 4-grams were already written
  revise_sections: 1        # ... the weakest-section rewrite fixes at least this many sections, worst first (2 showed no gain on 3 briefs); every section with an over-used detail is also rewritten
  ending_candidates: 3      # the last section is written this many ways and the judge keeps the best (1 turns it off)
  dedupe_ngram: 4           # the repeat guard compares 4-grams of paragraphs and sentences
  dedupe_paragraph: 0.6     # ... drops a paragraph when more than this share of its n-grams was already written
  dedupe_similar: 0.5       # ... or a paragraph that retells an earlier one in new words: this share of its content words are shared
  dedupe_similar_min: 10    # ... (only paragraphs with this many content words are compared)
  dedupe_sentence: 0.7      # ... or a sentence (of dedupe_min_words+ words) over this share
  dedupe_min_words: 6
  polish_repeat_slack: 0.05 # a polished section is rejected if its repeated-phrase rate rose by more than this
  tense_floor: 3            # a narrator switched tense when both tenses appear this often ...
  tense_share: 0.2          # ... and the rarer one is this share of all first-person verbs
  repeat_flag: 0.03         # a script repeating more than this share of phrases outside the setting words is flagged
  motif_max: 3              # a detail may return this often in the script; more is flagged (the same wording twice is listed)
  crowd_min: 5              # a crutch word (5+ letters) is used this often in the script ...
  crowd_share: 0.006        # ... and makes up more than this share of all words

length:                     # tuned against the README results; change one at a time and re-measure
  draft_min: 0.75           # a section draft is accepted between draft_min and draft_max x its word budget
  draft_max: 1.5
  token_cap: 1.8            # generation cap: tokens per budgeted word (models write 3-5x small budgets)
  polish_min: 0.7           # a polished section is accepted between polish_min and polish_max x its target
  polish_max: 1.3 
  fit_tolerance: 0.05       # the whole script is rewritten until within +/- this share of the target (0.1 let 823 words pass for a 750 target)
